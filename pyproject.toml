[build-system]
requires = ["poetry-core>=1.1.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "linux-show-player"
version = "0.6.5"
description = "Cue player for stage productions"
authors = ["Francesco Ceruti <ceppofrancy@gmail.com>"]
license = "GPLv3"
readme = "README.md"

homepage = "https://www.linux-show-player.org/"
repository = "https://github.com/FrancescoCeruti/linux-show-player"

packages = [
    { include = "lisp" }
]
exclude = [
    "lisp/i18n/ts/",
    "lisp/ui/themes/*/assets/"
]

[tool.poetry.dependencies]
python = ">= 3.9, < 4.0"
platformdirs = "^4.2"
falcon = "^4.0.1"
jack-client = { version = "^0.5", markers = "sys_platform == 'linux'" }
mido = "^1.3.3"
pygobject = "^3.30"
pyqt5 = "^5.15.2"
pyqt5-qt5 = "^5.15.2"
python-rtmidi = "^1.1"
requests = "^2.20"
sortedcontainers = "^2.0"
humanize = "^4.8.0"
numpy = ">= 1.26.4, < 3.0.0"
# Linux-only native bindings. The `sys_platform == 'linux'` markers keep the
# Linux install byte-for-byte identical to before (zero regression, Flatpak
# unaffected) while letting `pip`/`poetry` install cleanly on Windows/macOS
# without trying to build these Linux-kernel/JACK bindings.
pyalsa = { git = "https://github.com/alsa-project/alsa-python.git", rev="f8f9260282eb9c97f53e4689e04182dc87a4810e", markers = "sys_platform == 'linux'" }
# Use a pyliblo fork that define dependecies correctly.
# liblo is cross-platform, but the git build is painful off-Linux: keep it
# default on Linux and let other OSes opt in manually (the OSC plugin already
# degrades gracefully when liblo is absent, see Phase 6).
pyliblo3 = { git = "https://github.com/FrancescoCeruti/pyliblo3", rev = "9b66f93bc058807fdbe27f9255b18b0df8e60e32", markers = "sys_platform == 'linux'" }
qdigitalmeter = "^0.1.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "^7.1"
furo = "^2023.07.26"
myst-parser = "^2.0.0"
sphinx-autobuild = "^2021.3.14"
sphinx-inline-tabs = "^2023.4.21"

[tool.poetry.group.dev.dependencies]
toml = "*"
packaging = "*"
pygobject-stubs = "^2.11.0"
ruff = "^0.6.9"
pytest = "^8.0"

[tool.poetry.scripts]
linux-show-player = "lisp.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = 'py39'

[tool.ruff.lint]
ignore = ["F401", "E402"]